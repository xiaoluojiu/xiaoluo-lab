[project]
name = "xiaoluo-lab-backend"
version = "0.1.0"
description = "小洛实验室后端服务"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/xiaoluojiu/xiaoluo-lab"
Repository = "https://github.com/xiaoluojiu/xiaoluo-lab"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "fastexcel>=0.10",
    "fpdf2>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -m 'not slow'"

markers = [
    "slow: 慢测试，需要显式启用",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
"scripts/experiments/**" = ["E501"]