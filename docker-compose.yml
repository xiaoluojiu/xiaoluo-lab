# 小洛实验室 docker-compose（Prompt 233）
# 一键启动：backend + frontend，本地 volume 持久化
# 用法：
#   docker compose up -d --build
#   浏览器打开 http://localhost:8080 （frontend 容器的 80 端口映射到宿主 8080）
#   API Key 严禁写入此文件，从 .env 或环境变量读取
#
# 跨域：compose 里前端（:8080）与后端（:8000）**不同源**，浏览器会拦跨域。
# 若浏览器直连后端（而非走前端容器内的反向代理），需要在 backend 环境变量里
# 显式声明来源：CORS_ALLOW_ORIGINS=http://localhost:8080

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiaoluo-backend
    ports:
      - "8000:8000"
    environment:
      # 仅传非敏感配置；API Key 请用 .env 或 -e LLM_API_KEY=xxx
      APP_ENV: dev
      LOG_LEVEL: INFO
      DATA_ROOT: /app/data
      MODEL_ROOT: /app/models
      DATABASE_URL: sqlite:////app/data/xiaoluo.db
      # 跨域白名单：留空 ⇒ 不接受跨域请求。compose 部署下填前端实际访问地址。
      # CORS_ALLOW_ORIGINS: http://localhost:8080
      # 是否信任反向代理传递的 X-Forwarded-For（直连部署必须保持 false）
      # RATE_LIMIT_TRUST_X_FORWARDED_FOR: "false"
    volumes:
      - backend-data:/app/data
      - backend-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xiaoluo-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-models:
